<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="login-box">
      <h1>Sign up</h1>
      <i class="material-icons-account">account_circle</i>
      <h2>Sign Up as:</h2>
      <section class="role-select">
        <label>
          <input type="radio" name="role" />
          Librarian
        </label>
        <label>
          <input type="radio" name="role" />
          Admin
        </label>
      </section>
      <section class="login-detail">
        <section class="login-sec-row">
          <form action="">
            <i class="material-icons-login">badge</i>
            <input type="text" placeholder="Enter Full Name:" />
          </form>
        </section>
        <section class="login-sec-row">
          <form action="">
            <i class="material-icons-login">alternate_email</i>
            <input type="text" placeholder="Enter Username:" />
          </form>
        </section>

        <section class="login-sec-row">
          <form action="">
            <i class="material-icons-login">lock</i>
            <input type="text" placeholder="Enter Password:" />
          </form>
        </section>
        <section class="register-btn">
          <button>
            Sign Up
            <i class="material-icons">app_registration</i>
          </button>
        </section>
      </section>
    </section>
  </body>
</html>
